name: CI

on:
  push:
    branches: [main, feature/orcarouter-compatibility]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell syntax
        run: |
          for script in install.sh uninstall.sh scripts/*.sh; do
            bash -n "$script"
          done
      - name: Run ShellCheck
        run: shellcheck --severity=error install.sh uninstall.sh scripts/*.sh
      - name: Compile Python
        run: python3 -m compileall -q scripts tests
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check whitespace errors
        run: git diff --check
